# Pushing a tag like v1.1 builds, signs, notarises and publishes a release.
# The tag must match MARKETING_VERSION in project.yml.
# Running it by hand (Actions → Release → Run workflow) is a dry run: it builds,
# signs and notarises, and uploads the DMG as a workflow artifact instead.
#
# Repository secrets:
#   DEVELOPER_ID_P12           base64 of the "Developer ID Application" certificate
#                              and private key, exported from Keychain Access as .p12
#   DEVELOPER_ID_P12_PASSWORD  the password chosen when exporting it
#   NOTARY_KEY                 base64 of an App Store Connect API key (.p8)
#   NOTARY_KEY_ID              that key's ID
#   NOTARY_ISSUER_ID           the issuer ID shown above the key list
#   SPARKLE_ED_KEY             the Sparkle update-signing private key, from
#                              Sparkle's `generate_keys --account dvdforge -x <file>`
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Check the tag matches the version
        run: |
          version=$(sed -n 's/^ *MARKETING_VERSION: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' project.yml | head -1)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          [[ "$GITHUB_REF_TYPE" == tag ]] || exit 0
          [[ "$GITHUB_REF_NAME" == "v$version" ]] || {
            echo "::error::tag $GITHUB_REF_NAME doesn't match MARKETING_VERSION $version"; exit 1; }

      - name: Install tools
        run: brew install xcodegen meson ninja pkg-config create-dmg

      - name: Dependency cache key
        id: deps
        run: echo "key=deps-$(git submodule status | shasum | cut -c1-16)-${{ hashFiles('Scripts/build-deps.sh') }}" >> "$GITHUB_OUTPUT"

      - name: Restore vendored libraries
        uses: actions/cache@v6
        with:
          path: Vendor/build/DiscDeps.xcframework
          key: ${{ steps.deps.outputs.key }}

      - name: Import signing certificate
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 24)
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      - name: Build, sign and notarise
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          DVDFORGE_NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          DVDFORGE_NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          export DVDFORGE_NOTARY_KEY="$RUNNER_TEMP/notary.p8"
          echo "$NOTARY_KEY" | base64 --decode > "$DVDFORGE_NOTARY_KEY"
          Scripts/release.sh

      - name: Sign the update and write the appcast
        env:
          SPARKLE_ED_KEY: ${{ secrets.SPARKLE_ED_KEY }}
          SPARKLE_VERSION: 2.10.0
          SPARKLE_SHA256: c2bf58aa8387266ac179357b1415d6f2635f044da8be41042af32425dae6da0c
        run: |
          tools="$RUNNER_TEMP/sparkle"
          mkdir -p "$tools"
          curl -sSL -o "$tools/sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz"
          echo "$SPARKLE_SHA256  $tools/sparkle.tar.xz" | shasum -a 256 -c
          tar -xf "$tools/sparkle.tar.xz" -C "$tools"
          dmg="dist/dvdForge-$VERSION.dmg"
          signature=$(echo "$SPARKLE_ED_KEY" | "$tools/bin/sign_update" --ed-key-file - "$dmg")
          repo="https://github.com/$GITHUB_REPOSITORY"
          cat > dist/appcast.xml <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>dvdForge</title>
              <link>$repo</link>
              <item>
                <title>dvdForge $VERSION</title>
                <pubDate>$(LC_ALL=C date -u "+%a, %d %b %Y %H:%M:%S +0000")</pubDate>
                <sparkle:version>$VERSION</sparkle:version>
                <sparkle:shortVersionString>$VERSION</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>15.0</sparkle:minimumSystemVersion>
                <sparkle:fullReleaseNotesLink>$repo/releases/tag/v$VERSION</sparkle:fullReleaseNotesLink>
                <enclosure url="$repo/releases/download/v$VERSION/dvdForge-$VERSION.dmg" type="application/octet-stream" $signature />
              </item>
            </channel>
          </rss>
          XML
          cat dist/appcast.xml

      - name: Keep the dry-run build
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: dvdForge-${{ env.VERSION }}-dry-run
          path: dist/

      - name: Publish
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/dvdForge-$VERSION.dmg" "dist/dvdForge-$VERSION.dmg.sha256" dist/appcast.xml \
            --title "dvdForge $VERSION" --generate-notes

      - name: Clean up
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/notary.p8"
