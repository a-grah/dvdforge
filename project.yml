name: dvdForge
options:
  bundleIdPrefix: ca.bluepill.dvdforge
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    CLANG_CXX_LANGUAGE_STANDARD: c++20
    ARCHS: "$(ARCHS_STANDARD)"
    # build-deps.sh writes into Vendor/, which the script sandbox would block.
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  Deps:
    type: ""
    platform: macOS
    legacy:
      toolPath: /bin/zsh
      arguments: "$(SRCROOT)/Scripts/build-deps.sh"
      workingDirectory: "$(SRCROOT)"

  DiscCore:
    type: library.static
    platform: macOS
    sources:
      - path: DiscCore
    dependencies:
      - target: Deps
      - framework: Vendor/build/DiscDeps.xcframework
        link: false
    settings:
      base:
        PRODUCT_NAME: DiscCore
        HEADER_SEARCH_PATHS: "$(SRCROOT)/DiscCore/include"
        # Treat the vendored headers (copied here from the xcframework) as system headers.
        OTHER_CFLAGS: "-isystem $(BUILT_PRODUCTS_DIR)/include"

  DvdForge:
    type: application
    platform: macOS
    sources:
      - path: DvdForge
    dependencies:
      - target: DiscCore
      - framework: Vendor/build/DiscDeps.xcframework
        embed: false
      - sdk: IOKit.framework
      - sdk: DiskArbitration.framework
      - sdk: CoreFoundation.framework
    info:
      path: DvdForge/Info.plist
      properties:
        CFBundleDisplayName: dvdForge
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "© 2026 bluepill.ca"
    entitlements:
      path: DvdForge/DvdForge.entitlements
      properties:
        # Raw optical-device access and CSS ioctls are incompatible with the App Sandbox.
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_NAME: dvdForge
        PRODUCT_BUNDLE_IDENTIFIER: ca.bluepill.dvdforge
        MARKETING_VERSION: "1.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_OBJC_INTEROP_MODE: objcxx
        SWIFT_INCLUDE_PATHS: "$(SRCROOT)/DiscCore/include"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: YES

  DiscCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/DiscCoreTests
    dependencies:
      - target: DiscCore
      - framework: Vendor/build/DiscDeps.xcframework
        embed: false
      - sdk: IOKit.framework
      - sdk: CoreFoundation.framework
    settings:
      base:
        SWIFT_OBJC_INTEROP_MODE: objcxx
        SWIFT_INCLUDE_PATHS: "$(SRCROOT)/DiscCore/include"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"

  DvdForgeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/DvdForgeTests
    dependencies:
      - target: DvdForge
    settings:
      base:
        # The app's product name differs from its target name.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/dvdForge.app/Contents/MacOS/dvdForge"
        BUNDLE_LOADER: "$(TEST_HOST)"
        SWIFT_OBJC_INTEROP_MODE: objcxx
        SWIFT_INCLUDE_PATHS: "$(SRCROOT)/DiscCore/include"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"

schemes:
  dvdForge:
    build:
      targets:
        DvdForge: all
    test:
      targets:
        - DiscCoreTests
        - DvdForgeTests
      preActions:
        - name: Build test fixture
          settingsTarget: DiscCoreTests
          script: '"$SRCROOT/Scripts/make-fixture.sh"'
